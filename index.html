<!doctype html><html lang="en"><head><meta charset="UTF-8"><script>(function(){var c;try{c=localStorage.getItem('hwcs-theme')}catch(e){}document.documentElement.dataset.theme=c==='dark'||(c!=='light'&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light'})()</script><script>/* Just after a new build goes out, its files can briefly fail to load, which would leave a blank page until someone reloads. So retry a few times, then say what happened. */(function(){var key='hwcs-load-retries',waits=[1500,3000,5000,8000],failed=0;addEventListener('error',function(e){var t=e.target,n=-1;if(failed||!t||!/^(SCRIPT|LINK)$/.test(t.tagName||'')||!/\/assets\//.test(t.src||t.href||''))return;failed=1;try{n=+sessionStorage.getItem(key)||0;if(n<waits.length)sessionStorage.setItem(key,n+1);else{sessionStorage.removeItem(key);n=-1}}catch(x){n=-1}if(n>=0)return void setTimeout(function(){location.reload()},waits[n]);var root=document.getElementById('root');if(root&&!root.childNodes.length)root.innerHTML='<p role="alert" style="padding:24px;font-family:sans-serif">This page didn’t load. <a href="" style="color:inherit">Reload to try again</a>.</p>'},true);addEventListener('load',function(){if(!failed)try{sessionStorage.removeItem(key)}catch(x){}})})()</script><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Find your people at HW CompSoc. Join the Discord, explore events and learn together at Heriot-Watt."><title>HW CompSoc — Find your people.</title><link rel="icon" href="/website-assets/favicon.svg"></head><body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body></html>
